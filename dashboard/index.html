<!--
  Token Radar v2.3 — how the board is built, in one paragraph, for the judge.

  The value model is a size curve fitted on this snapshot's own traded tokens: log10(market
  cap) = 4.8350 + 0.3624 x log10(TVL) - 0.2092 x log10(age_days + 1), fitted by least squares
  on 93 comps, one per ticker, CEX and bridge-family categories set aside. The age term is
  kept because the out-of-sample tests keep it; the growth term is dropped because they do
  not. Out-of-sample mean absolute error in log10 dollars, chosen model vs a flat median
  multiple: blind holdout (mean of 5 seeded 20% holdouts) 0.6219 vs 0.7248, time-split (fit
  on protocols listed before 2024-07-08, test on the newer half) 0.6310 vs 0.8042,
  leave-one-out 0.6557 vs 0.7393. The bare TVL-only curve scores 0.6237 / 0.6451 / 0.6461
  on the same three tests; adding the growth term scores 0.6354 / 0.6320 / 0.6662 and its
  fitted sign flips across blind seeds (+0.91, -0.53, -0.76, -1.35, -1.16), so it is
  dropped. Bootstrap, 1,000 resamples of the chosen curve: slope 95% CI [0.1056, 0.6033],
  age coefficient 95% CI [-0.9406, 0.3366], fitted multiple at one year of age 0.245x at
  $50M TVL with 95% CI [0.141, 0.438] (at $5M [0.463, 2.923], at $500M [0.028, 0.118]).
  Rank ranges on the board come from 200 further refits; the median row moves ±64 ranks.
  Coverage: the board ranks all 198 rankable pre-token protocols in the snapshot — the 40
  on the watchlist plus the 158 below the $50M floor that pass the watchlist's own rule.
  Of the 342 pre-token protocols, 144 are set aside by that rule: 42 CEX, 86 bridge-family
  categories, 11 versioned pools, 5 wrapped/staked names. Every farm plan is netted to
  the dollar on the cheapest chain the protocol runs on: gas is the only cost you do not
  get back, the capital stays locked and withdrawable. Implied value is the model's claim,
  not a price, and no token is promised: a protocol on this board records no token, it
  does not prove it has none.
-->
